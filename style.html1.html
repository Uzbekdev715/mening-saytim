<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <!-- Telefon va kompyuter ekraniga moslashadi -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mening ma'lumotlarim</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000000;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        .profile {
            width: 100px;
            height: 100px;
            background: #222;
            border-radius: 50%;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .text {
            color: #999;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .link {
            display: block;
            text-decoration: none;
            color: white;

            padding: 18px;
            margin: 15px 0;

            border: 1px solid #333;
            border-radius: 15px;

            background: #111;

            transition: 0.3s;
        }

        .link:hover {
            transform: scale(1.03);
            background: #1b1b1b;
        }

        .link-title {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .username {
            color: #999;
            font-size: 14px;
        }

        .instagram:hover {
            border-color: #001aff;
        }

        .telegram:hover {
            border-color: #ff0000;
        }

        .phone:hover {
            border-color: #fffb00;
        }

        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Profil rasmi o'rniga hozircha vip turibdi -->
        <div class="profile">
            vip
        </div>

        <!-- ISMINGIZNI SHU YERGA YOZING -->
        <h1>BEKMUROD</h1>

        <p class="text">
            Men bilan bog'lanish uchun 👇
        </p>


        <!-- INSTAGRAM -->
        <a
            href="https://instagram.com/SIZNING_INSTAGRAM"
            class="link instagram"
            target="_blank"
        >
            <span class="link-title">Instagram sahifam</span>
            <span class="username">@gentravibe.uz
                @onixvibe.uz
            </span>
        </a>


        <!-- TELEGRAM -->
        <a
            href="https://t.me/bekhmurod"
            class="link telegram"
            target="_blank"
        >
            <span class="link-title"> Telegram sahifam </span>
            <span class="username">@bekhmurod</span>
        </a>


        <!-- TELEFON -->
        <a
            href="tel:+99820 027-08-77"
            class="link phone"
        >
            <span class="link-title"> Telefon raqamim </span>
            <span class="username">+998 20 027 08 77</span>
        </a>


        <div class="footer">
            © made by Bekmurod 
        </div>

    </div>

</body>
</html>
